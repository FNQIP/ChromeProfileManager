name: Compatibility

# 多版本 macOS / 多架构的兼容性验证。
#
# 为什么不放进每次推送的 CI：GitHub 的 macOS arm64 Runner 产能紧张，实测
# `macos-15`(arm64) 经常排队 10 分钟以上，而 `macos-15-intel`(x64) 一分钟内就能分配。
# 日常 CI 只用一个 x64 Runner 完成测试 + Universal 构建；这里用每周定时 + 手动触发
# 的方式补上 arm64 与更新/更旧系统的实跑验证。
on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 更新系统 + arm64 实跑
  test-newest-macos:
    name: 单元测试与构建 (macos-26, arm64)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择并检查 Xcode
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Xcode 步骤失败：行 ${LINENO}，命令 ${BASH_COMMAND}"' ERR
          if ! APP="$(./Scripts/select-xcode.sh)"; then
            echo "::error::select-xcode.sh 未能选出可用 Xcode（详见上方日志）"
            exit 1
          fi
          echo "使用 Xcode：${APP}"
          sudo xcode-select -s "${APP}"
          xcode-select -p
          xcodebuild -version
          sw_vers
          swift --version

      - name: 单元测试
        run: swift test --parallel

      - name: Universal 构建（原生 arm64）
        env:
          CPM_BUILD_BACKEND: auto
        run: ./Scripts/build-app.sh

      - name: 校验架构与最低系统
        run: |
          set -euo pipefail
          BIN=build/ChromeProfiles.app/Contents/MacOS/ChromeProfiles
          lipo -archs "$BIN" | tr ' ' '\n' | grep -qx x86_64
          lipo -archs "$BIN" | tr ' ' '\n' | grep -qx arm64
          vtool -show-build "$BIN" | grep -c "minos 12.0" | grep -qx 2
          ./build/ChromeProfiles.app/Contents/MacOS/ChromeProfiles --diagnostics | head -12

  # 较旧系统实跑（当前仍可用的最老镜像）
  test-older-macos:
    name: 单元测试 (macos-14, macOS 14)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择并检查 Xcode
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Xcode 步骤失败：行 ${LINENO}，命令 ${BASH_COMMAND}"' ERR
          if ! APP="$(./Scripts/select-xcode.sh)"; then
            echo "::error::select-xcode.sh 未能选出可用 Xcode（详见上方日志）"
            exit 1
          fi
          echo "使用 Xcode：${APP}"
          sudo xcode-select -s "${APP}"
          xcode-select -p
          xcodebuild -version
          sw_vers
          swift --version

      - name: 单元测试
        run: swift test --parallel

      - name: 构建并冒烟（x86_64 + arm64）
        env:
          CPM_BUILD_BACKEND: auto
        run: |
          set -euo pipefail
          ./Scripts/build-app.sh
          lipo -archs build/ChromeProfiles.app/Contents/MacOS/ChromeProfiles | tr ' ' '\n' | grep -qx x86_64
          ./build/ChromeProfiles.app/Contents/MacOS/ChromeProfiles --diagnostics | grep -q "配置根目录"
